version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionforge-backend
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionforge-frontend
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      - backend
